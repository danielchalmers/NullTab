name: Release

on:
  push:
    paths:
      - 'manifest.json'
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Extract version from manifest
        id: get_version
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Package
        run: |
          zip -r null-tab-${{ steps.get_version.outputs.VERSION }}.zip manifest.json newtab.html icons

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.get_version.outputs.VERSION }}
          artifacts: null-tab-${{ steps.get_version.outputs.VERSION }}.zip
          skipIfReleaseExists: true
